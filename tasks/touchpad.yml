- name: Check if the configuration file exists
  become: yes
  ansible.builtin.stat:
    path: /etc/X11/xorg.conf.d/99-touchpad.conf
  register: touchpad_conf_stat

- name: Create touchpad configuration file if it doesn't exist
  become: yes
  ansible.builtin.copy:
    dest: /etc/X11/xorg.conf.d/99-touchpad.conf
    content: |
      # This file is automatically generated by Ansible
      Section "InputClass"
      Identifier "touchpad overrides"
      Driver "libinput"
      MatchIsTouchpad "on"
      Option "Tapping" "on"
      Option "TappingButtonMap" "lmr"
      Option "NaturalScrolling" "true"
      EndSection
  when: touchpad_conf_stat.stat.exists == false

- name: Ensure correct permissions for touchpad configuration file
  become: yes
  ansible.builtin.file:
    path: /etc/X11/xorg.conf.d/99-touchpad.conf
    owner: root
    group: root
    mode: '0644'

